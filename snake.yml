name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # runs once a day
  workflow_dispatch: {} # allows manual trigger from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animations
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#0E7C86
            dist/github-contribution-grid-snake.svg?palette=github&color_snake=#0B5F67
            dist/github-contribution-grid-snake-dark.gif?palette=github-dark&color_snake=#0E7C86&frame_duration=100
            dist/github-contribution-grid-snake-hex-dark.svg?palette=github-dark&color_snake=#0E7C86&drawing=hexagon

      - name: Push snake animations to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
